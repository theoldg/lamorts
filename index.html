/* ---------- layout: time runs left to right ---------- */
const CW=144,CH=60,SG=22,HG=12,CG=96,COL=CW+CG,NS="http://www.w3.org/2000/svg";
const world=document.getElementById("world");
const people=[],keys={};let uid=0;
const nb=n=>n.s?CH*2+SG:CH;
function measure(n){n.w=nb(n);n.cw=n.c?n.c.reduce((a,c)=>a+measure(c),0)+HG*(n.c.length-1):0;n.tw=Math.max(n.w,n.cw);return n.tw}
function place(n,x,y){n.x=x;n.y=y+n.tw/2;if(n.c){let cy=y+(n.tw-n.cw)/2;n.c.forEach(c=>{place(c,x+COL,cy);cy+=c.tw+HG})}}
const topY=n=>n.y-(CH+SG)/2,botY=n=>n.y+(CH+SG)/2;
const bloodY=n=>!n.s?n.y:(n.anchor==="s"?botY(n):topY(n));
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);(p||world).appendChild(e);return e}
const eL=document.createElementNS(NS,"g"),cL=document.createElementNS(NS,"g");world.append(eL,cL);
// x = left edge, my = vertical centre; per.cx/per.cy = centre x / top y
function card(per,x,my){
  per.id=uid++;per.cx=x+CW/2;per.cy=my-CH/2;people[per.id]=per;
  const g=el("g",{class:"card "+per.st,"data-id":per.id,transform:`translate(${x},${my-CH/2})`,tabindex:0,role:"button","aria-label":fullName(per)},cL);
  el("rect",{width:CW,height:CH,rx:5},g);
  const ty=per.sn?21:26;
  const nm=el("text",{x:10,y:ty,class:"nm"},g);nm.textContent=per.g;
  if(per.g.length>15)nm.setAttribute("textLength",CW-20),nm.setAttribute("lengthAdjust","spacingAndGlyphs");
  if(per.sn){const s=el("text",{x:10,y:ty+13,class:"sn"},g);s.textContent=per.sn;if(per.sn.length>20)s.setAttribute("textLength",CW-20),s.setAttribute("lengthAdjust","spacingAndGlyphs")}
  if(per.d)el("text",{x:10,y:CH-9,class:"dt"},g).textContent=per.d;
  if(per.mpf)el("text",{x:CW-9,y:CH-9,class:"mpf","text-anchor":"end"},g).textContent="MPF";
}
function path(d,cls){return el("path",{class:"edge"+(cls?" "+cls:""),d},eL)}
function couple(x,my,a,b){const mx=x+CW/2;
  el("line",{class:"edge",x1:mx,x2:mx,y1:my-SG/2,y2:my+SG/2},eL);
  el("text",{x:mx-8,y:my+5,class:"inf","text-anchor":"end"},eL).textContent="∞";
  card(a,x,my-(CH+SG)/2);card(b,x,my+(CH+SG)/2)}
function draw(n,parent){
  if(n.key)keys[n.key]=n;
  n.parent=parent;
  if(n.s){couple(n.x,n.y,n.p,n.s);n.p.node=n;n.s.node=n}
  else{card(n.p,n.x,n.y);n.p.node=n}
  if(n.c){const sx=n.x+(n.s?CW/2:CW),jx=n.x+CW+CG/2,ys=n.c.map(bloodY);
    path(`M${sx},${n.y}H${jx}`);path(`M${jx},${Math.min(...ys,n.y)}V${Math.max(...ys,n.y)}`);
    n.c.forEach(c=>{path(`M${jx},${bloodY(c)}H${c.x}`,c.uc?"unc":"");draw(c,n)})}
}
measure(treeB);measure(treeA);
place(treeB,0,0);place(treeA,0,treeB.tw+160);
draw(treeB);draw(treeA);

// Marie-Barbe also hangs from the Pondrom couple
const mb=julesMB.s,jA=treeA.x+CW+CG/2;
path(`M${jA},${Math.min(...treeA.c.map(bloodY))}V${mb.cy+CH/2}H${mb.cx-CW/2}`);
// Ernest hangs from Eugène, crossing to his marriage with Claire
const eu=keys.eugene,ern=ernestClaire.p,lane=eu.x+CW+CG/2+20,ernY=ern.cy+CH/2;
path(`M${eu.x+CW/2},${eu.y}H${lane}V${ernY}H${ern.cx-CW/2}`,"lane");
const lm=(eu.y+ernY)/2;
el("text",{x:lane+6,y:lm,class:"lbl","text-anchor":"middle",transform:`rotate(90 ${lane+6} ${lm})`},eL).textContent="Ernest → married his second cousin Claire";

// Hoefnagel ancestors to the left of Thérèse
const th=treeA.s,thY=th.cy+CH/2,X=k=>treeA.x-k*COL;
const albert=P("Albert Joseph","de Hoefnagel","1733–1802",{facts:["Father of Thérèse"]});
const alex=P("Alexandre Joseph","de Hoefnagel",null,{st:"unc",facts:["Placed above Albert Joseph on the wall; exact link not drawn"]});
const claireU=P("Claire","d'Uytenbroeck",null,{st:"unc",facts:["Heiress of Schutbourg (wall label)"]});
const balth=P("Balthasar","de Hoefnagel","1549–1608",{st:"unc",facts:["Died in Mechelen (Malines)","Earlier ancestor; generations in between are not on the wall"]});
const charl=P("Charlotte","de Iserin",null,{st:"unc",facts:["Wall: “Charlotte de Iserin ép. Claude de Humyn”; placement in the line not shown"]});
const humyn=P("Claude","de Humyn",null,{st:"unc"});
card(albert,X(1),thY);path(`M${X(1)+CW},${thY}H${treeA.x}`);
const acy=thY+(CH+SG)/2;couple(X(2),acy,alex,claireU);
path(`M${X(2)+CW/2},${acy}H${X(1)-CG/2}V${thY}H${X(1)}`,"unc");
card(balth,X(3),thY);path(`M${X(3)+CW},${thY}H${X(2)}`,"dot");
el("text",{x:X(3)+CW+6,y:thY-6,class:"lbl"},eL).textContent="… generations";
couple(X(3),thY+200,charl,humyn);
el("text",{x:X(3),y:thY-70,class:"band"},eL).textContent="Hoefnagel · Schutbourg";
el("text",{x:-40,y:treeB.y+15,class:"band","text-anchor":"end"},eL).textContent="Lamort · Senningen";
el("text",{x:-40,y:treeA.y-treeA.tw/2+60,class:"band","text-anchor":"end"},eL).textContent="Pondrom · Saint-Louis & Dallas";

/* ---------- pan / zoom ---------- */
const vp=document.getElementById("vp");
let T={x:0,y:0,k:1};
const apply=()=>world.setAttribute("transform",`translate(${T.x},${T.y}) scale(${T.k})`);
function zoomAt(f,px,py){const k=Math.min(3,Math.max(.01,T.k*f));f=k/T.k;T.x=px-(px-T.x)*f;T.y=py-(py-T.y)*f;T.k=k;apply()}
function fit(){const b=world.getBBox(),r=vp.getBoundingClientRect(),k=Math.min(r.width/(b.width+60),r.height/(b.height+60),1.2);
  T.k=k;T.x=(r.width-b.width*k)/2-b.x*k;T.y=(r.height-b.height*k)/2-b.y*k;apply()}
function focus(per,k=.8){const r=vp.getBoundingClientRect();T.k=k;T.x=r.width/2-per.cx*k;T.y=r.height/2-(per.cy+CH/2)*k;apply()}
const ptrs=new Map();let moved=0,last=null;
vp.addEventListener("pointerdown",e=>{if(e.target.closest(".ctl,#sheet"))return;vp.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;vp.classList.add("drag");last=null});
vp.addEventListener("pointermove",e=>{if(!ptrs.has(e.pointerId))return;const p=ptrs.get(e.pointerId);
  if(ptrs.size===1){T.x+=e.clientX-p.x;T.y+=e.clientY-p.y;moved+=Math.abs(e.clientX-p.x)+Math.abs(e.clientY-p.y);apply()}
  p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===2){const[a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y),r=vp.getBoundingClientRect(),mx=(a.x+b.x)/2-r.left,my=(a.y+b.y)/2-r.top;
    if(last){zoomAt(d/last.d,mx,my);T.x+=mx-last.mx;T.y+=my-last.my;apply()}last={d,mx,my};moved=99}});
function up(e){if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);last=null;if(!ptrs.size)vp.classList.remove("drag");
  if(moved<6&&!ptrs.size){const c=document.elementFromPoint(e.clientX,e.clientY)?.closest(".card");if(c)show(+c.dataset.id)}}
vp.addEventListener("pointerup",up);vp.addEventListener("pointercancel",up);
vp.addEventListener("wheel",e=>{e.preventDefault();const r=vp.getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*.0015),e.clientX-r.left,e.clientY-r.top)},{passive:false});
const ctr=()=>{const r=vp.getBoundingClientRect();return[r.width/2,r.height/2]};
document.getElementById("zin").onclick=()=>zoomAt(1.3,...ctr());
document.getElementById("zout").onclick=()=>zoomAt(1/1.3,...ctr());
document.getElementById("zfit").onclick=fit;
world.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){const c=e.target.closest(".card");if(c){e.preventDefault();show(+c.dataset.id)}}});

/* ---------- details ---------- */
const sheet=document.getElementById("sheet"),sin=document.getElementById("sheetIn");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function fullName(p){if(p.full)return p.full;const g=p.g.replace(/ \?$/,"");return p.sn?`${g} ${p.sn}`:`${g} Lamort de Gail`}
function srcHTML(k){const[s,u]=SRC[k];return u?`<a href="${u}" target="_blank" rel="noopener">${esc(s)}</a>`:esc(s)}
function relatives(p){const n=p.node,out=[];
  if(n.s)out.push(["Spouse",n.p===p?n.s:n.p]);
  const par=n.parent; if(par&&(n.p===p&&n.anchor!=="s"||n.s===p&&n.anchor==="s"))out.push(["Parents",par.p]);
  if(p===mb)out.push(["Parents",treeA.p]);
  if(p===ern)out.push(["Parents",eu.p]);
  (n.c||[]).forEach(c=>out.push(["Child",c.p]));return out}
function show(id){const p=people[id];
  document.querySelectorAll(".card.sel").forEach(c=>c.classList.remove("sel"));
  cL.querySelector(`[data-id="${id}"]`).classList.add("sel");
  const tag=p.st==="rec"?'<span class="tg rec">Found in public records</span>':p.st==="unc"?'<span class="tg unc">Unclear or conflicting</span>':'<span class="tg">From family sources</span>';
  const rel=relatives(p);
  sin.innerHTML=`<h2>${esc(fullName(p))}</h2>${p.d?`<div class="d">${esc(p.d)}</div>`:""}
   <div class="tags">${tag}${p.mpf?'<span class="tg mp">Mort pour la France</span>':""}</div>
   ${p.facts?`<ul>${p.facts.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>`:""}
   ${rel.length?`<div class="rel">${rel.map(([r,q])=>`<button data-go="${q.id}">${r}: ${esc(q.g.replace(/ \?$/,""))}</button>`).join("")}</div>`:""}
   <div class="src">Sources: ${(p.src||[]).map(srcHTML).join(" · ")}</div>`;
  sheet.hidden=false}
sin.addEventListener("click",e=>{const b=e.target.closest("[data-go]");if(b){const q=people[+b.dataset.go];focus(q,Math.max(T.k,.6));show(q.id)}});
document.getElementById("close").onclick=()=>{sheet.hidden=true;document.querySelectorAll(".card.sel").forEach(c=>c.classList.remove("sel"))};

/* ---------- search + branch chips ---------- */
const dl=document.getElementById("names"),byLabel={};
people.forEach(p=>{if(p.g==="—"||p.g==="?")return;let lab=fullName(p)+(p.d?` (${p.d})`:"");while(byLabel[lab])lab+=" ";byLabel[lab]=p;
  const o=document.createElement("option");o.value=lab;dl.appendChild(o)});
const q=document.getElementById("q");
function go(p){focus(p);show(p.id);const c=cL.querySelector(`[data-id="${p.id}"]`);c.classList.add("hl");setTimeout(()=>c.classList.remove("hl"),1600)}
q.addEventListener("change",()=>{const p=byLabel[q.value]||people.find(x=>fullName(x).toLowerCase().includes(q.value.trim().toLowerCase()));if(p){go(p);q.blur()}});
[["Ernest & Claire",ern],["Claude",ernestClaire.c[0].p],["Marc",ernestClaire.c[1].p],["Lise & Couzy",ernestClaire.c[3].p],["Ottenheimer",ottenheimer.p],["Clarens",wilhelm.p],["Jacques 1785",treeB.p],["Hoefnagel",th],["Pondrom USA",treeA.c[2].p]]
 .forEach(([t,p])=>{const b=document.createElement("button");b.textContent=t;b.onclick=()=>go(p);document.getElementById("chips").appendChild(b)});

requestAnimationFrame(()=>focus(ern,.55));
</script>
