<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Famille Lamort</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Bright canvas, white cards with family-coloured avatars, foldable branches, side panel for details */
:root{
  --paper:#f4f6fa; --dot:rgba(60,80,120,.13); --ink:#17212b; --muted:#5f6b78;
  --card:#ffffff; --cardline:#dfe4ec; --couple:rgba(120,140,180,.10); --line:#a9b4c2;
  --accent:#2563c9; --unc:#c77a12; --link:#8a5cd6; --chip:#eef1f6; --mpf:#b4232c; --shadow:rgba(30,50,90,.12);
  --lam:#2563c9; --gail:#0f9784; --pon:#d0791b; --hoef:#8a5cd6; --oth:#7d8896;
  --f-name:"Spectral",Georgia,serif; --f-ui:"IBM Plex Sans",system-ui,-apple-system,sans-serif; --f-data:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#11161d; --dot:rgba(190,205,225,.08); --ink:#e6ebf1; --muted:#97a3b1;
  --card:#1b222c; --cardline:#2c3643; --couple:rgba(150,170,210,.07); --line:#4f5d6e;
  --accent:#78a9f0; --unc:#e6a24f; --link:#b499ee; --chip:#242d39; --mpf:#f08a8f; --shadow:rgba(0,0,0,.4);
  --lam:#6fa0ef; --gail:#3cc4ae; --pon:#eca04c; --hoef:#b499ee; --oth:#8e9aa8; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11161d; --dot:rgba(190,205,225,.08); --ink:#e6ebf1; --muted:#97a3b1;
  --card:#1b222c; --cardline:#2c3643; --couple:rgba(150,170,210,.07); --line:#4f5d6e;
  --accent:#78a9f0; --unc:#e6a24f; --link:#b499ee; --chip:#242d39; --mpf:#f08a8f; --shadow:rgba(0,0,0,.4);
  --lam:#6fa0ef; --gail:#3cc4ae; --pon:#eca04c; --hoef:#b499ee; --oth:#8e9aa8; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:14px var(--f-ui);overflow:hidden;display:flex;flex-direction:column}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;flex-direction:column;gap:10px;padding:12px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));
  padding-top:calc(12px + env(safe-area-inset-top));background:var(--card);box-shadow:0 1px 0 var(--cardline),0 2px 12px var(--shadow);z-index:5}
.top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
#q{margin-left:auto;align-self:center}
h1{font:600 1.4rem var(--f-name);margin:0;letter-spacing:.01em}
.sub{color:var(--muted);font-size:.8rem}
.mail{align-self:center;display:flex;align-items:center;gap:7px;height:36px;padding:0 13px 0 11px;border-radius:99px;border:1px solid var(--cardline);background:var(--paper);color:var(--ink);font:500 13px var(--f-ui);text-decoration:none;white-space:nowrap}
.mail:hover{border-color:var(--accent)}
.mail svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linejoin:round}
.fix{margin:14px 0;padding:10px 12px;border-radius:10px;background:var(--chip);font-size:.84rem;line-height:1.5}
.fix a{color:var(--accent);font-weight:500;white-space:nowrap}
.theme{align-self:center;width:36px;height:36px;border-radius:50%;border:1px solid var(--cardline);background:var(--paper);cursor:pointer;display:grid;place-items:center}
.theme:hover{border-color:var(--accent)}
.theme svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.theme .sun{display:none}.dark .theme .sun{display:inline}.dark .theme .moon{display:none}
.search{flex:none;display:flex;align-items:center;gap:8px;font:400 14px var(--f-ui);padding:7px 14px 7px 11px;border-radius:99px;border:1px solid var(--cardline);background:var(--paper);color:var(--muted);width:240px;cursor:text;text-align:left;white-space:nowrap;overflow:hidden}
.search:hover{border-color:var(--accent)}
.search svg,.pkhd svg{flex:none;width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:2}

/* person picker: a search field with its own result list, pinned to the top so a phone keyboard never covers it */
#picker{position:fixed;inset:0;z-index:20;background:rgba(10,20,35,.4);display:flex;justify-content:center;align-items:flex-start;padding:max(70px,env(safe-area-inset-top)) 12px 12px}
#picker[hidden]{display:none}
.pk{background:var(--card);width:min(520px,100%);max-height:min(72vh,600px);border-radius:16px;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.25);border:1px solid var(--cardline)}
.pkt{padding:14px 16px 0;font:600 .95rem var(--f-name)}
.pkt:empty{display:none}
.pkhd{display:flex;align-items:center;gap:10px;padding:12px 12px 12px 16px;border-bottom:1px solid var(--cardline)}
#pkq{flex:1;min-width:0;font:400 16px var(--f-ui);border:0;background:none;color:var(--ink);outline:none;padding:6px 0}
#pkx{flex:none;font:500 13px var(--f-ui);border:0;background:var(--chip);border-radius:99px;padding:7px 12px;cursor:pointer}
#pkl{list-style:none;margin:0;padding:6px;overflow-y:auto;overscroll-behavior:contain}
#pkl button{width:100%;display:flex;align-items:center;gap:12px;padding:8px 10px;border:0;border-radius:10px;background:none;cursor:pointer;text-align:left}
#pkl button:hover,#pkl button.on{background:var(--chip)}
#pkl .av{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font:600 11.5px var(--f-ui);color:var(--fc);background:color-mix(in srgb,var(--fc) 16%,var(--card));border:1px solid color-mix(in srgb,var(--fc) 45%,var(--card))}
#pkl b{display:block;font:600 14.5px var(--f-name)}
#pkl small{display:block;font:400 11.5px var(--f-ui);color:var(--muted);margin-top:1px}
#pkl .none{padding:16px;color:var(--muted);font-size:.9rem}
@media (max-width:640px){#picker{padding:0;background:var(--card)}.pk{width:100%;height:100%;height:100dvh;max-height:none;border-radius:0;border:0;box-shadow:none;padding-top:env(safe-area-inset-top)}}

#vp{position:relative;flex:1;min-height:0;touch-action:none;cursor:grab;overflow:hidden;
  background-color:var(--paper);background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:22px 22px}
#vp.drag{cursor:grabbing}
#svg{position:absolute;inset:0;width:100%;height:100%;display:block}

.edge{fill:none;stroke:var(--line);stroke-width:1.5;transition:opacity .2s}
.edge.unc{stroke:var(--unc);stroke-dasharray:5 4}
.edge.dot{stroke-dasharray:2 5;stroke-width:1.8}
.lbl{font:italic 11.5px var(--f-ui);fill:var(--link)}
.edge.halo{stroke:var(--paper);stroke-width:9}
.cpl{fill:var(--couple);transition:opacity .2s}
.band{font:italic 500 46px var(--f-name);fill:var(--muted);opacity:.28}

.card{cursor:pointer;transition:opacity .2s}
.card .bg{fill:var(--card);stroke:var(--cardline);stroke-width:1;filter:drop-shadow(0 1px 3px var(--shadow))}
.card.unc .bg{stroke:var(--unc);stroke-dasharray:5 3;stroke-width:1.4}
.card:hover .bg{stroke:var(--accent)}
.card.sel .bg{stroke:var(--accent);stroke-width:2.6}
.card.hl .bg{stroke:var(--link);stroke-width:3.5}
.card .av{fill:color-mix(in srgb,var(--fc) 16%,var(--card));stroke:color-mix(in srgb,var(--fc) 45%,var(--card));stroke-width:1}
.card .ini{fill:var(--fc);font:600 12.5px var(--f-ui);letter-spacing:.02em}
.f-lam{--fc:var(--lam)} .f-gail{--fc:var(--gail)} .f-pon{--fc:var(--pon)} .f-hoef{--fc:var(--hoef)} .f-oth{--fc:var(--oth)}
.nm{font:600 15.5px var(--f-name);fill:var(--ink)}
.sn{font:500 9px var(--f-ui);fill:var(--muted);letter-spacing:.09em;text-transform:uppercase}
.dt{font:400 10.5px var(--f-data);fill:var(--muted)}
.ok{fill:var(--accent)}
.mpf{font:600 8.5px var(--f-ui);fill:var(--mpf);letter-spacing:.08em}

.tog{cursor:pointer}
.tog rect{fill:var(--card);stroke:var(--line);stroke-width:1.2}
.tog text{font:600 11px var(--f-ui);fill:var(--muted)}
.tog:hover rect{stroke:var(--accent)}
.tog.shut rect{fill:var(--accent);stroke:var(--accent)} .tog.shut text{fill:var(--card)}

#world.focusing .card:not(.lin){opacity:.3}
#world.focusing .edge,#world.focusing .cpl{opacity:.4}

.ctl{position:absolute;left:max(12px,env(safe-area-inset-left));top:12px;display:flex;flex-direction:column;gap:6px;z-index:3}
.ctl button{width:40px;height:40px;border-radius:12px;border:1px solid var(--cardline);background:var(--card);cursor:pointer;font:500 17px var(--f-ui);box-shadow:0 1px 4px var(--shadow);display:grid;place-items:center}
.ctl button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ctl hr{border:0;height:4px;margin:0}
.ctl button:hover{border-color:var(--accent)}

.legend{position:absolute;left:max(12px,env(safe-area-inset-left));bottom:calc(12px + env(safe-area-inset-bottom));z-index:3;background:var(--card);border:1px solid var(--cardline);border-radius:12px;padding:8px 12px;
  display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.74rem;color:var(--muted);max-width:min(560px,calc(100% - 24px));box-shadow:0 1px 4px var(--shadow)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.legend i.unc{border-radius:3px;background:none;border:1.5px dashed var(--unc)}
.legend i.ok{width:7px;height:7px;background:var(--accent)}

#sheet{position:absolute;left:0;right:0;bottom:0;z-index:4;background:var(--card);border-top:1px solid var(--cardline);box-shadow:0 -8px 30px var(--shadow);
  max-height:56%;overflow:auto;border-radius:18px 18px 0 0;padding:20px max(18px,env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
@media (min-width:900px){#sheet{left:auto;top:12px;right:12px;bottom:12px;width:380px;max-height:none;border-radius:16px;border:1px solid var(--cardline)}}
#sheet .in{max-width:62ch;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.hd{display:flex;gap:14px;align-items:center;padding-right:40px}
.big{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font:600 18px var(--f-ui);color:var(--fc);
  background:color-mix(in srgb,var(--fc) 16%,var(--card));border:1px solid color-mix(in srgb,var(--fc) 45%,var(--card))}
#sheet h2{font:600 1.3rem/1.2 var(--f-name);margin:0;text-wrap:balance}
#sheet .d{font:400 .85rem var(--f-data);color:var(--muted);margin-top:3px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tg{font-size:.72rem;font-weight:500;padding:3px 9px;border-radius:99px;background:var(--chip)}
.tg.unc{color:var(--unc)} .tg.mp{color:var(--mpf)} .tg.rec{color:var(--accent)}
#sheet ul{margin:0;padding-left:1.1em;line-height:1.55;font-size:.92rem}
#sheet h3{font:600 .7rem var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:4px 0 -4px}
.rel{display:flex;gap:6px;flex-wrap:wrap}
.rel button{font:500 12.5px var(--f-ui);padding:5px 11px 5px 8px;border-radius:99px;border:1px solid var(--cardline);background:var(--paper);cursor:pointer;display:flex;align-items:center;gap:6px}
.rel button:hover{border-color:var(--accent)}
.rel i{width:8px;height:8px;border-radius:50%;background:var(--fc)}
.src{font-size:.78rem;color:var(--muted);line-height:1.55;border-top:1px solid var(--cardline);padding-top:10px}
#sheet a{color:var(--accent)}
#relbar{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:3;width:max-content;max-width:min(640px,calc(100% - 140px));background:var(--card);border:1px solid var(--cardline);border-radius:14px;
  box-shadow:0 2px 12px var(--shadow);padding:10px 12px 10px 16px;display:flex;gap:12px;align-items:center;font:500 .95rem/1.4 var(--f-ui)}
#relbar[hidden]{display:none}
#relbar .rb{display:flex;gap:6px;flex:none}
#relbar button{font:500 12.5px var(--f-ui);padding:6px 11px;border-radius:99px;border:0;background:var(--chip);cursor:pointer}
#relbar button:hover{background:color-mix(in srgb,var(--accent) 14%,var(--chip))}
.relmode #xall,.relmode #call,.relmode .legend{display:none}
.search.cmp{width:100%}
@media (max-width:640px){#relbar{left:64px;right:12px;transform:none;width:auto;max-width:none;flex-direction:column;align-items:flex-start;gap:8px}}
.close{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;border:0;background:var(--chip);font-size:15px;cursor:pointer}
@media (max-width:640px){#q{order:3;width:100%;margin:0}.theme{margin-left:auto}.legend{display:none}.sub{display:none}.mail{margin-left:auto;padding:0;width:36px;justify-content:center}.mail span{display:none}.mail+.theme{margin-left:0}}
</style>
</head>
<body>
<header>
  <div class="top"><h1>Famille Lamort</h1><span class="sub" id="sub"></span>
    <button class="search" id="q"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Rechercher une personne…</button>
    <a id="mail" class="mail" title="Signaler une erreur ou envoyer un complément"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3.5 6 8.5 7 8.5-7"/></svg><span>Corrections et compléments</span></a>
    <button id="theme" class="theme" aria-label="Passer en mode sombre" title="Passer en mode sombre"><svg viewBox="0 0 24 24"><path class="moon" d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/><g class="sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g></svg></button></div>
</header>
<div id="vp">
  <svg id="svg" aria-label="Arbre généalogique"><g id="world"></g></svg>
  <div class="ctl">
    <button id="zin" aria-label="Zoom avant" title="Zoom avant">+</button>
    <button id="zout" aria-label="Zoom arrière" title="Zoom arrière">−</button>
    <button id="zfit" aria-label="Voir tout l'arbre" title="Voir tout l'arbre"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
    <hr>
    <button id="xall" aria-label="Déplier toutes les branches" title="Déplier toutes les branches"><svg viewBox="0 0 24 24"><path d="m7 9 5 5 5-5M7 4l5 5 5-5M5 20h14"/></svg></button>
    <button id="call" aria-label="Replier toutes les branches" title="Replier toutes les branches"><svg viewBox="0 0 24 24"><path d="m7 15 5-5 5 5M7 20l5-5 5 5M5 4h14"/></svg></button>
  </div>
  <div class="legend">
    <span><i style="--c:var(--lam)"></i>Lamort</span><span><i style="--c:var(--gail)"></i>de Gail</span><span><i style="--c:var(--pon)"></i>Pondrom</span><span><i style="--c:var(--hoef)"></i>Hoefnagel</span><span><i style="--c:var(--oth)"></i>autres</span>
    <span><i class="ok"></i>archives publiques</span><span><i class="unc"></i>incertain</span>
  </div>
  <div id="relbar" hidden><span id="reltxt"></span><span class="rb"><button id="relswap"></button><button id="relx">✕ Arbre complet</button></span></div>
  <div id="picker" hidden role="dialog" aria-modal="true" aria-labelledby="pkt"><div class="pk">
    <div class="pkt" id="pkt"></div>
    <div class="pkhd"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="pkq" type="search" placeholder="Tapez un nom…" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-label="Nom" aria-controls="pkl"><button id="pkx">Annuler</button></div>
    <ul id="pkl" role="listbox"></ul></div></div>
  <div id="sheet" hidden><button class="close" id="close" aria-label="Fermer">✕</button><div class="in" id="sheetIn"></div></div>
</div>

<script type="module">
/* ---------- theme ---------- */
const root=document.documentElement,mq=matchMedia("(prefers-color-scheme: dark)"),tb=document.getElementById("theme");
function setTheme(t){if(t)root.dataset.theme=t;const dark=t?t==="dark":mq.matches;root.classList.toggle("dark",dark);
  const l=`Passer en mode ${dark?"clair":"sombre"}`;tb.setAttribute("aria-label",l);tb.title=l}
try{setTheme(localStorage.getItem("theme"))}catch(e){setTheme(null)}
mq.addEventListener("change",()=>{if(!root.dataset.theme)setTheme(null)});
tb.onclick=()=>{const t=root.classList.contains("dark")?"light":"dark";setTheme(t);try{localStorage.setItem("theme",t)}catch(e){}};


/* ---------- data (data.json) ---------- */
let D;
try{D=await fetch("data.json").then(r=>{if(!r.ok)throw Error(r.status);return r.json()})}
catch(e){document.getElementById("sub").textContent="Impossible de charger data.json. Ouvrez cette page par un serveur web, pas comme un fichier.";throw e}
// mailto link for corrections, with the subject (and the person concerned) filled in
const mailto=p=>`mailto:${D.contact}?subject=${encodeURIComponent("Famille Lamort"+(p?" : "+fullName(p):""))}`+(p?`&body=${encodeURIComponent(`Au sujet ${de(fullName(p))}${p.d?` (${p.d})`:""} :\n\n`)}`:"");
document.getElementById("mail").href=mailto();
const SRC=D.sources,[lam,pon]=D.trees;

/* ---------- model ---------- */
// per.id is the person's index in people; the data's own ids are kept in byId
const people=[],nodes=[],byId={};
function reg(per,node){if(per.id)byId[per.id]=per;per.id=people.length;people.push(per);per.node=node;per.st??="fam";per.src??=["wall"]}
const blood=n=>n.anchor==="s"?n.s:n.p;
// fsn: the surname used in full names; children take it from their parent unless they have their own
function walk(n,parent,depth){n.nid=nodes.length;nodes.push(n);n.parent=parent;n.depth=depth;n.open=!n.fold;
  const b=blood(n),o=n.s&&(b===n.p?n.s:n.p);
  b.fsn=b.sn||(parent&&(parent.csn||blood(parent).fsn))||"";if(o)o.fsn=o.sn||b.fsn;
  reg(n.p,n);if(n.s)reg(n.s,n);n.cnt=0;(n.c||[]).forEach(c=>{walk(c,n,depth+1);n.cnt+=c.cnt+(c.s?2:1)})}
walk(lam,null,0);
// the Pondroms start in the column before their daughter Marie-Barbe
walk(pon,null,byId[D.links.find(l=>l.parents.includes(pon.p.id)).child].node.depth-1);
// people drawn beside the tree rather than in it
D.extras.forEach(n=>{reg(n.p,n);n.p.fsn=n.p.sn;if(n.s){reg(n.s,n);n.s.fsn=n.s.sn}});

// links that cross between branches
function xlink(par,kid){par.forEach(q=>(q.xkids=q.xkids||[]).push(kid));(kid.xpar=kid.xpar||[]).push(...par)}
const xl=D.links.map(l=>({par:l.parents.map(r=>byId[r]),kid:byId[l.child]}));
xl.forEach(l=>xlink(l.par,l.kid));
const ern=byId.ernest;

const spouse=p=>{const n=p.node;return n.s?(n.p===p?n.s:n.p):null};
function parents(p){const n=p.node,out=[];if(n.parent&&blood(n)===p){out.push(n.parent.p);if(n.parent.s)out.push(n.parent.s)}return out.concat(p.xpar||[])}
const children=p=>(p.node.c||[]).map(blood).concat(p.xkids||[]);
function lineage(p){const S=new Set([p]),sp=spouse(p);if(sp)S.add(sp);
  const up=q=>parents(q).forEach(r=>{if(!S.has(r)){S.add(r);up(r)}});
  const dn=q=>children(q).forEach(r=>{if(!S.has(r)){S.add(r);dn(r)}});
  up(p);dn(p);if(sp)dn(sp);return S}

const given=p=>p.g.replace(/ \?$/,"");
function fullName(p){return p.full||[given(p),p.fsn].filter(Boolean).join(" ")}
function fam(p){const s=p.fsn||"";return /Pondrom/.test(s)?"pon":/Hoefnagel|Uytenbroeck/.test(s)?"hoef":/Lamort/.test(s)?"lam":/Gail/.test(s)?"gail":"oth"}
function initials(p){const g=p.g.replace(/[“”"?—]/g,"").trim(),s=(p.fsn||"").replace(/^(de |d'|le |du )/i,"").replace(/[—?]/g,"").trim();return g?(g[0]+(s[0]||"")).toUpperCase():"?"}

/* ---------- layout: time runs left to right ---------- */
const CW=184,CH=64,SG=10,PAD=6,HG=18,CG=130,COL=CW+CG,NS="http://www.w3.org/2000/svg";
const world=document.getElementById("world");
const eL=document.createElementNS(NS,"g"),cL=document.createElementNS(NS,"g"),tL=document.createElementNS(NS,"g");world.append(eL,cL,tL);
const kids=n=>n.c&&n.open!==false?n.c:null;

const ptrs=new Map();let moved=0,last=null;

/* ---------- relationship between two people ---------- */
let rel=null;
const relbar=document.getElementById("relbar"),reltxt=document.getElementById("reltxt");
const sname=p=>p.g==="—"?fullName(p):[given(p),p.fsn].filter(Boolean).join(" ");
// French words come in three forms: [masculine, feminine, sex unknown]
const G=(w,x)=>w[x==="m"?0:x==="f"?1:2];
const cap=t=>t[0].toUpperCase()+t.slice(1);
const vow=t=>/^[aeiouyéèêîôh]/i.test(t);
const de=t=>(vow(t)?"d’":"de ")+t;
// "le neveu", "l’oncle"; with the sex unknown French drops the article ("est cousin(e) de …")
const art=(t,x)=>x?(vow(t)?"l’":x==="f"?"la ":"le ")+t:t;
const deArt=(t,x)=>x?(vow(t)?"de l’":x==="f"?"de la ":"du ")+t:"de "+t;
const poss=(t,x)=>x?(x==="f"&&!vow(t)?"sa ":"son ")+t:t;
const EP=["époux","épouse","conjoint(e)"];
const nth=n=>n===1?"1re":n+"e";
const arr=n=>"arrière-".repeat(n);
// what someone b generations below a shared ancestor is to someone a generations below it, for sex x;
// tail is said after the other person's name
function term(a,b,x){const g=w=>G(w,x),e=g(["","e","(e)"]);
  if(a===0)return b>=5?`descendant${e} à la ${nth(b)} génération`:b===1?g(["fils","fille","enfant"]):arr(b-2)+g(["petit-fils","petite-fille","petit-enfant"]);
  if(b===0)return a>=5?`ancêtre à la ${nth(a)} génération`:a===1?g(["père","mère","parent"]):arr(a-2)+g(["grand-père","grand-mère","grand-parent"]);
  if(a===1&&b===1)return g(["frère","sœur","frère ou sœur"]);
  if(a===1)return b>=5?`descendant${e} à la ${nth(b-1)} génération d’un frère ou d’une sœur`:b===2?g(["neveu","nièce","neveu ou nièce"]):arr(b-3)+g(["petit-neveu","petite-nièce","petit-neveu ou petite-nièce"]);
  if(b===1)return a>=5?`${g(["frère","sœur","frère ou sœur"])} d’un ancêtre à la ${nth(a-1)} génération`:a===2?g(["oncle","tante","oncle ou tante"]):arr(a-3)+g(["grand-oncle","grand-tante","grand-oncle ou grand-tante"]);
  const m=Math.min(a,b);
  return m===2?g(["cousin germain","cousine germaine","cousin(e) germain(e)"]):m===3?g(["cousin issu de germains","cousine issue de germains","cousin(e) issu(e) de germains"]):`${g(["cousin","cousine","cousin(e)"])} au ${m-1}e degré`}
const tail=(a,b)=>{const m=Math.min(a,b),r=Math.abs(a-b);return m>=2&&r?`, à ${r} génération${r>1?"s":""} d’écart`:""};
function ups(p){const D=new Map([[p,{d:0,prev:null}]]),q=[p];
  while(q.length){const x=q.shift(),d=D.get(x).d;parents(x).forEach(r=>{if(!D.has(r)){D.set(r,{d:d+1,prev:x});q.push(r)}})}return D}
// closest shared ancestor of a and b, with the path a → ancestor → b
function kin(a,b){const A=ups(a),B=ups(b);let k=null;
  A.forEach((v,x)=>{const w=B.get(x);if(w&&(!k||v.d+w.d<k.a+k.b))k={ca:x,a:v.d,b:w.d}});
  if(!k)return null;
  const pa=[];for(let x=k.ca;x;x=A.get(x).prev)pa.unshift(x);
  const pb=[];for(let x=k.ca;x;x=B.get(x).prev)pb.push(x);
  k.path=pa.concat(pb.slice(1));k.steps=k.path.map((_,i)=>i===0?null:i<=k.a?"up":"down");
  const cs=spouse(k.ca);if(cs&&A.get(cs)?.d===k.a&&B.get(cs)?.d===k.b)k.cs=cs;
  return k}
function relate(A,B){
  const sA=spouse(A),sB=spouse(B),k=kin(A,B),n=sname,ep=p=>G(EP,p.x);
  if(k){const t=term(k.a,k.b,B.x),tl=tail(k.a,k.b);
    return{...k,text:B===sA?`${n(B)} est ${art(ep(B),B.x)} ${de(n(A))}, et aussi ${poss(t,B.x)}${tl}.`:`${n(B)} est ${art(t,B.x)} ${de(n(A))}${tl}.`}}
  if(B===sA)return{path:[A,B],steps:[null,"sp"],text:`${n(B)} est ${art(ep(B),B.x)} ${de(n(A))}.`};
  // related by marriage: try through either spouse
  const opts=[];
  if(sA){const k=kin(sA,B);if(k)opts.push({...k,path:[A,...k.path],steps:[null,"sp",...k.steps.slice(1)],cost:k.a+k.b+1,
    text:`${n(B)} est ${art(term(k.a,k.b,B.x),B.x)} ${deArt(ep(sA),sA.x)} ${de(n(A))}, ${n(sA)}${tail(k.a,k.b)}.`})}
  if(sB){const k=kin(A,sB);if(k)opts.push({...k,path:[...k.path,B],steps:[...k.steps,"sp"],cost:k.a+k.b+1,
    text:`${n(B)} est ${art(ep(B),B.x)} ${deArt(term(k.a,k.b,sB.x),sB.x)} ${de(n(A))}, ${n(sB)}${tail(k.a,k.b)}.`})}
  if(sA&&sB){const k=kin(sA,sB);if(k)opts.push({...k,path:[A,...k.path,B],steps:[null,"sp",...k.steps.slice(1),"sp"],cost:k.a+k.b+2,
    text:`${cap(art(ep(sB),sB.x))} ${de(n(B))}, ${n(sB)}, est ${art(term(k.a,k.b,sB.x),sB.x)} ${deArt(ep(sA),sA.x)} ${de(n(A))}, ${n(sA)}${tail(k.a,k.b)}.`})}

  const path=[];for(let x=B;x;x=prev.get(x))path.unshift(x);
  const steps=path.map((x,i)=>i===0?null:parents(path[i-1]).includes(x)?"up":children(path[i-1]).includes(x)?"down":"sp");
  return{path,steps,text:`${n(A)} et ${n(B)} sont reliés par ${path.length-1} liens familiaux.`}}

// lay the chain out with time left to right: going up a generation moves left, down moves right,
// and each turn (or marriage) starts a new row
function drawRel(){
  const RH=CH+48,{path:Pp,steps:st}=rel,pos=[{g:0,lane:0}];let g=0,lane=0,last=null;
  for(let i=1;i<Pp.length;i++){const s=st[i];
    if(s==="up"){if(last==="down")lane++;g--}
    else if(s==="down"){if(last==="up"){pos[i-1].lane=lane+.5;lane++}g++}
    else lane++;
    last=s==="sp"?null:s;pos.push({g,lane})}
  const g0=Math.min(...pos.map(p=>p.g)),X=i=>(pos[i].g-g0)*COL,Y=i=>pos[i].lane*RH;
  const ca=rel.ca?Pp.indexOf(rel.ca):-1;
  Pp.forEach((p,i)=>{if(i===ca&&rel.cs)couple(X(i),Y(i)+(CH+SG)/2,p,rel.cs);else card(p,X(i),Y(i))});
  if(ca>=0){const top=rel.cs?Y(ca)-CH/2-PAD:Y(ca)-CH/2;
    el("text",{x:X(ca)+4,y:top-8,class:"lbl"},eL).textContent=rel.cs?"ancêtres communs les plus proches":"ancêtre commun le plus proche"}
  const out=i=>i===ca&&rel.cs?[X(i)+CW+PAD,Y(i)+(CH+SG)/2]:[X(i)+CW,Y(i)];
  for(let i=1;i<Pp.length;i++){const s=st[i];
    if(s==="sp"){const x=X(i)+CW/2,y1=Math.min(Y(i),Y(i-1))+CH/2,y2=Math.max(Y(i),Y(i-1))-CH/2;
      path(`M${x},${y1}V${y2}`);el("text",{x:x+8,y:(y1+y2)/2+5,class:"inf"},eL).textContent="∞";continue}
    const [pi,ci]=s==="up"?[i,i-1]:[i-1,i],[ox,oy]=out(pi);curve(ox,oy,X(ci),Y(ci))}
}
function startRel(A,B){if(A===B)return;rel={A,B,...relate(A,B)};sheet.hidden=true;sel=lin=null;
  reltxt.textContent=rel.text;relbar.hidden=false;
  const sw=document.getElementById("relswap");sw.textContent=`⇄ Que représente ${given(A)} pour ${given(B)} ?`;sw.title="Voir le même lien du point de vue de l’autre personne";vp.classList.add("relmode");render();fit()}
function endRel(){if(!rel)return;const A=rel.A;rel=null;relbar.hidden=true;vp.classList.remove("relmode");reveal(A);render();focus(A,.8,1)}
document.getElementById("relx").onclick=endRel;
document.getElementById("relswap").onclick=()=>startRel(rel.B,rel.A);

/* ---------- search ---------- */
function lookup(v){const t=v.trim().toLowerCase();return t?byLabel[v]||people.find(x=>fullName(x).toLowerCase().includes(t)):null}
function go(p){if(rel){rel=null;relbar.hidden=true;vp.classList.remove("relmode");render()}reveal(p);show(p.id);focus(p);const c=cL.querySelector(`[data-id="${p.id}"]`);c.classList.add("hl");setTimeout(()=>c.classList.remove("hl"),1600)}
const byLabel={};
people.forEach(p=>{if(p.g==="—"||p.g==="?")return;let lab=fullName(p)+(p.d?` (${p.d})`:"");while(byLabel[lab])lab+=" ";byLabel[lab]=p});

/* ---------- person picker ---------- */
const picker=document.getElementById("picker"),pkq=document.getElementById("pkq"),pkl=document.getElementById("pkl"),pkt=document.getElementById("pkt");
const fold=t=>t.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const findable=people.filter(p=>p.g!=="—"&&p.g!=="?");
findable.forEach(p=>p.q=fold(`${fullName(p)} ${sname(p)} ${p.d||""}`));
const byName=(a,b)=>fold(a.g).localeCompare(fold(b.g));
let pkDone=null,pkSkip=null,pkHits=[],pkOn=0;
function pick(title,done,skip){pkDone=done;pkSkip=skip;pkt.textContent=title||"";pkq.value="";picker.hidden=false;pkList();pkq.focus()}
function pkClose(){picker.hidden=true;pkDone=null;pkq.blur()}
function pkList(){const ts=fold(pkq.value).split(/\s+/).filter(Boolean);
  pkHits=findable.filter(p=>p!==pkSkip&&ts.every(t=>p.q.includes(t)));
  // names that start with what was typed come first
  const st=p=>ts.length&&fold(p.g).startsWith(ts[0])?0:1;
  pkHits.sort((a,b)=>st(a)-st(b)||byName(a,b));pkOn=0;
  pkl.innerHTML=pkHits.length?pkHits.map((p,i)=>`<li><button role="option" data-i="${i}" class="f-${fam(p)}${i?"":" on"}"><span class="av">${esc(initials(p))}</span>
    <span><b>${esc(fullName(p))}</b><small>${esc([p.d,parents(p).length?"enfant de "+parents(p).map(r=>r.g).join(" et "):spouse(p)?G(["marié","mariée","marié(e)"],p.x)+" à "+sname(spouse(p)):""].filter(Boolean).join(" · "))}</small></span></button></li>`).join("")
    :`<li class="none">Personne ne correspond à « ${esc(pkq.value)} ».</li>`;pkl.scrollTop=0}
function pkMove(d){const bs=pkl.querySelectorAll("button");if(!bs.length)return;bs[pkOn].classList.remove("on");pkOn=(pkOn+d+bs.length)%bs.length;bs[pkOn].classList.add("on");bs[pkOn].scrollIntoView({block:"nearest"})}
function pkChoose(i){const p=pkHits[i],f=pkDone;if(!p)return;pkClose();f(p)}
pkq.addEventListener("input",pkList);
pkq.addEventListener("keydown",e=>{if(e.key==="ArrowDown"||e.key==="ArrowUp"){e.preventDefault();pkMove(e.key==="ArrowDown"?1:-1)}
  else if(e.key==="Enter"){e.preventDefault();pkChoose(pkOn)}else if(e.key==="Escape"){e.stopPropagation();pkClose()}});
pkl.addEventListener("click",e=>{const b=e.target.closest("button");if(b)pkChoose(+b.dataset.i)});
document.getElementById("pkx").onclick=pkClose;
picker.addEventListener("click",e=>{if(e.target===picker)pkClose()});
document.getElementById("q").onclick=()=>pick("",go);
document.getElementById("sub").textContent=`${people.filter(p=>p.g!=="—").length} personnes · touchez une fiche pour les détails, ± pour replier une branche`;

render();
requestAnimationFrame(()=>focus(ern,.8,1));
// for the browser console
window.tree={people,nodes,byId,lookup,go,startRel,endRel,render,focus};
</script>
</body>
</html>
