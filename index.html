<style>
/* Bright canvas, white cards with family-coloured avatars, foldable branches, side panel for details */
:root{

  --f-name:"Spectral",Georgia,serif; --f-ui:"IBM Plex Sans",system-ui,-apple-system,sans-serif; --f-data:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#11161d; --dot:rgba(190,205,225,.08); --ink:#e6ebf1; --muted:#97a3b1;
  --card:#1b222c; --cardline:#2c3643; --couple:rgba(150,170,210,.07); --line:#4f5d6e;
  --accent:#78a9f0; --unc:#e6a24f; --link:#b499ee; --chip:#242d39; --mpf:#f08a8f; --shadow:rgba(0,0,0,.4);
  --lam:#6fa0ef; --gail:#3cc4ae; --pon:#eca04c; --hoef:#b499ee; --oth:#8e9aa8; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#11161d; --dot:rgba(190,205,225,.08); --ink:#e6ebf1; --muted:#97a3b1;
  --card:#1b222c; --cardline:#2c3643; --couple:rgba(150,170,210,.07); --line:#4f5d6e;
  --accent:#78a9f0; --unc:#e6a24f; --link:#b499ee; --chip:#242d39; --mpf:#f08a8f; --shadow:rgba(0,0,0,.4);
  --lam:#6fa0ef; --gail:#3cc4ae; --pon:#eca04c; --hoef:#b499ee; --oth:#8e9aa8; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font:14px var(--f-ui);overflow:hidden;display:flex;flex-direction:column}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;flex-direction:column;gap:10px;padding:12px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));
  padding-top:calc(12px + env(safe-area-inset-top));background:var(--card);box-shadow:0 1px 0 var(--cardline),0 2px 12px var(--shadow);z-index:5}
.top{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1{font:600 1.4rem var(--f-name);margin:0;letter-spacing:.01em}
.sub{color:var(--muted);font-size:.8rem}
.theme{margin-left:auto;align-self:center;width:36px;height:36px;border-radius:50%;border:1px solid var(--cardline);background:var(--paper);cursor:pointer;display:grid;place-items:center}
.theme:hover{border-color:var(--accent)}
.theme svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.theme .sun{display:none}.dark .theme .sun{display:inline}.dark .theme .moon{display:none}
.tools{display:flex;gap:10px;align-items:center;min-width:0}
.search{position:relative;flex:none}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--muted);fill:none;stroke-width:2}
#q{font:400 14px var(--f-ui);padding:7px 12px 7px 30px;border-radius:99px;border:1px solid var(--cardline);background:var(--paper);color:var(--ink);width:220px}
.chips{display:flex;gap:6px;overflow-x:auto;min-width:0;scrollbar-width:none}
.chips button{flex:none;font:500 12.5px var(--f-ui);padding:6px 12px;border-radius:99px;border:0;background:var(--chip);cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:6px}
.chips button:hover{background:color-mix(in srgb,var(--accent) 14%,var(--chip))}
.chips i{width:8px;height:8px;border-radius:50%;background:var(--c)}

#vp{position:relative;flex:1;min-height:0;touch-action:none;cursor:grab;overflow:hidden;
  background-color:var(--paper);background-image:radial-gradient(var(--dot) 1px,transparent 1.2px);background-size:22px 22px}
#vp.drag{cursor:grabbing}
#svg{position:absolute;inset:0;width:100%;height:100%;display:block}

.edge{fill:none;stroke:var(--line);stroke-width:1.5;transition:opacity .2s}
.edge.unc{stroke:var(--unc);stroke-dasharray:5 4}
.edge.dot{stroke-dasharray:2 5;stroke-width:1.8}
.lbl{font:italic 11.5px var(--f-ui);fill:var(--link)}
.jump{cursor:pointer}.jump text{font:500 11.5px var(--f-ui);fill:var(--link)}.jump:hover text{text-decoration:underline}
.cpl{fill:var(--couple);transition:opacity .2s}
.band{font:italic 500 46px var(--f-name);fill:var(--muted);opacity:.28}

.card{cursor:pointer;transition:opacity .2s}
.card .bg{fill:var(--card);stroke:var(--cardline);stroke-width:1;filter:drop-shadow(0 1px 3px var(--shadow))}
.card.unc .bg{stroke:var(--unc);stroke-dasharray:5 3;stroke-width:1.4}
.card:hover .bg{stroke:var(--accent)}
.card.sel .bg{stroke:var(--accent);stroke-width:2.6}
.card.hl .bg{stroke:var(--link);stroke-width:3.5}
.card .av{fill:color-mix(in srgb,var(--fc) 16%,var(--card));stroke:color-mix(in srgb,var(--fc) 45%,var(--card));stroke-width:1}
.card .ini{fill:var(--fc);font:600 12.5px var(--f-ui);letter-spacing:.02em}
.f-lam{--fc:var(--lam)} .f-gail{--fc:var(--gail)} .f-pon{--fc:var(--pon)} .f-hoef{--fc:var(--hoef)} .f-oth{--fc:var(--oth)}
.nm{font:600 15.5px var(--f-name);fill:var(--ink)}
.sn{font:500 9px var(--f-ui);fill:var(--muted);letter-spacing:.09em;text-transform:uppercase}
.dt{font:400 10.5px var(--f-data);fill:var(--muted)}
.ok{fill:var(--accent)}
.mpf{font:600 8.5px var(--f-ui);fill:var(--mpf);letter-spacing:.08em}

.tog{cursor:pointer}
.tog rect{fill:var(--card);stroke:var(--line);stroke-width:1.2}
.tog text{font:600 11px var(--f-ui);fill:var(--muted)}
.tog:hover rect{stroke:var(--accent)}
.tog.shut rect{fill:var(--accent);stroke:var(--accent)} .tog.shut text{fill:var(--card)}

#world.focusing .card:not(.lin){opacity:.3}
#world.focusing .edge,#world.focusing .cpl{opacity:.4}

.ctl{position:absolute;left:max(12px,env(safe-area-inset-left));top:12px;display:flex;flex-direction:column;gap:6px;z-index:3}
.ctl button{width:40px;height:40px;border-radius:12px;border:1px solid var(--cardline);background:var(--card);cursor:pointer;font:500 17px var(--f-ui);box-shadow:0 1px 4px var(--shadow);display:grid;place-items:center}
.ctl button svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ctl hr{border:0;height:4px;margin:0}
.ctl button:hover{border-color:var(--accent)}

.legend{position:absolute;left:max(12px,env(safe-area-inset-left));bottom:calc(12px + env(safe-area-inset-bottom));z-index:3;background:var(--card);border:1px solid var(--cardline);border-radius:12px;padding:8px 12px;
  display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.74rem;color:var(--muted);max-width:min(560px,calc(100% - 24px));box-shadow:0 1px 4px var(--shadow)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--c)}
.legend i.unc{border-radius:3px;background:none;border:1.5px dashed var(--unc)}
.legend i.ok{width:7px;height:7px;background:var(--accent)}

#sheet{position:absolute;left:0;right:0;bottom:0;z-index:4;background:var(--card);border-top:1px solid var(--cardline);box-shadow:0 -8px 30px var(--shadow);
  max-height:56%;overflow:auto;border-radius:18px 18px 0 0;padding:20px max(18px,env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}

#sheet .in{max-width:62ch;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.hd{display:flex;gap:14px;align-items:center;padding-right:40px}
.big{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font:600 18px var(--f-ui);color:var(--fc);

.tags{display:flex;gap:6px;flex-wrap:wrap}
.tg{font-size:.72rem;font-weight:500;padding:3px 9px;border-radius:99px;background:var(--chip)}
.tg.unc{color:var(--unc)} .tg.mp{color:var(--mpf)} .tg.rec{color:var(--accent)}

#sheet h3{font:600 .7rem var(--f-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:4px 0 -4px}
.rel{display:flex;gap:6px;flex-wrap:wrap}
.rel button{font:500 12.5px var(--f-ui);padding:5px 11px 5px 8px;border-radius:99px;border:1px solid var(--cardline);background:var(--paper);cursor:pointer;display:flex;align-items:center;gap:6px}
.rel button:hover{border-color:var(--accent)}
.rel i{width:8px;height:8px;border-radius:50%;background:var(--fc)}
.src{font-size:.78rem;color:var(--muted);line-height:1.55;border-top:1px solid var(--cardline);padding-top:10px}
#sheet a{color:var(--accent)}
.close{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:50%;border:0;background:var(--chip);font-size:15px;cursor:pointer}
@media (max-width:640px){#q{width:150px}.legend{display:none}.sub{display:none}}
</style>
</head>

/* ---------- layout: time runs left to right ---------- */
const CW=184,CH=64,SG=10,PAD=6,HG=18,CG=84,COL=CW+CG,NS="http://www.w3.org/2000/svg";

// x = left edge, my = vertical centre; per.cx/per.cy = centre x / top y
function card(per,x,my){
  per.vis=1;per.cx=x+CW/2;per.cy=my-CH/2;
  const g=el("g",{class:`card ${per.st} f-${fam(per)}`,"data-id":per.id,transform:`translate(${x},${my-CH/2})`,tabindex:0,role:"button","aria-label":fullName(per)},cL);

  el("text",{class:"ini",x:30,y:CH/2+4.5,"text-anchor":"middle"},g).textContent=initials(per);
  const ty=per.sn?(per.d?24:29):(per.d?29:37);
  const nm=el("text",{x:58,y:ty,class:"nm"},g);nm.textContent=per.g;
  if(per.g.length>14)nm.setAttribute("textLength",CW-70),nm.setAttribute("lengthAdjust","spacingAndGlyphs");
  if(per.sn){const s=el("text",{x:58,y:ty+13,class:"sn"},g);s.textContent=per.sn;if(per.sn.length>18)s.setAttribute("textLength",CW-70),s.setAttribute("lengthAdjust","spacingAndGlyphs")}
  if(per.d)el("text",{x:58,y:CH-11,class:"dt"},g).textContent=per.d;
  if(per.st==="rec")el("circle",{class:"ok",cx:CW-11,cy:11,r:3.5},g);

function couple(x,my,a,b){

  card(a,x,my-(CH+SG)/2);card(b,x,my+(CH+SG)/2)}
function toggle(n){const open=n.open!==false,t=open?"−":"+"+n.cnt,w=open?20:14+t.length*7,cx=outX(n)+8+w/2;
  el("line",{class:"edge",x1:outX(n),x2:cx-w/2,y1:n.y,y2:n.y},eL);
  const g=el("g",{class:"tog"+(open?"":" shut"),"data-nid":n.nid,transform:`translate(${cx},${n.y})`,tabindex:0,role:"button",
    "aria-label":`${open?"Fold":"Unfold"} descendants of ${fullName(n.p)}`},tL);
  el("title",{},g).textContent=open?"Fold this branch":`Show ${n.cnt} more`;
  el("rect",{x:-w/2,y:-10,width:w,height:20,rx:10},g);el("text",{y:4,"text-anchor":"middle"},g).textContent=t;

function draw(n){
  if(n.s)couple(n.x,n.y,n.p,n.s);else card(n.p,n.x,n.y);
  const h=(n.s?CH+SG/2+PAD:CH/2);
  if(n.noteTop)note(n.x,n.y-h-7,...n.noteTop);
  if(n.noteBot)note(n.x,n.y+h+15,...n.noteBot);
  if(n.c){const tr=toggle(n),k=kids(n);if(!k)return;
    // one trunk per family, at a fixed spot in the gap between generations

  el("text",{x:-60,y:treeB.y+14,class:"band","text-anchor":"end"},eL).textContent="Lamort · Senningen";
  el("text",{x:-60,y:thY+300,class:"band","text-anchor":"end"},eL).textContent="Pondrom · Saint-Louis & Dallas";

const vp=document.getElementById("vp");
let T={x:0,y:0,k:1},anim=0;
const apply=()=>world.setAttribute("transform",`translate(${T.x},${T.y}) scale(${T.k})`);
function animTo(n,ms=450){cancelAnimationFrame(anim);const s={...T},t0=performance.now();
  const step=now=>{let u=Math.min(1,(now-t0)/ms);u=1-Math.pow(1-u,3);T={x:s.x+(n.x-s.x)*u,y:s.y+(n.y-s.y)*u,k:s.k+(n.k-s.k)*u};apply();if(u<1)anim=requestAnimationFrame(step)};
  anim=requestAnimationFrame(step)}
function zoomAt(f,px,py){cancelAnimationFrame(anim);const k=Math.min(3,Math.max(.03,T.k*f));f=k/T.k;T.x=px-(px-T.x)*f;T.y=py-(py-T.y)*f;T.k=k;apply()}
// the visible area, minus the details panel
function area(){const r=vp.getBoundingClientRect();let w=r.width,h=r.height;
  if(!sheet.hidden){const s=sheet.getBoundingClientRect();if(s.width<r.width-40)w=s.left-r.left;else h=s.top-r.top}return{w,h}}
function fit(){const b=world.getBBox(),{w,h}=area(),k=Math.min(w/(b.width+80),h/(b.height+80),1.2);
  animTo({k,x:(w-b.width*k)/2-b.x*k,y:(h-b.height*k)/2-b.y*k})}
function focus(per,k=Math.max(T.k,.75),now){const {w,h}=area(),t={k,x:w/2-per.cx*k,y:h/2-(per.cy+CH/2)*k};if(now){T=t;apply()}else animTo(t)}
const ptrs=new Map();let moved=0,last=null;
vp.addEventListener("pointerdown",e=>{if(e.target.closest(".ctl,#sheet,.legend"))return;cancelAnimationFrame(anim);vp.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;vp.classList.add("drag");last=null});
vp.addEventListener("pointermove",e=>{if(!ptrs.has(e.pointerId))return;const p=ptrs.get(e.pointerId);
  if(ptrs.size===1){T.x+=e.clientX-p.x;T.y+=e.clientY-p.y;moved+=Math.abs(e.clientX-p.x)+Math.abs(e.clientY-p.y);apply()}
  p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===2){const[a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y),r=vp.getBoundingClientRect(),mx=(a.x+b.x)/2-r.left,my=(a.y+b.y)/2-r.top;

  if(moved<6&&!ptrs.size)activate(document.elementFromPoint(e.clientX,e.clientY))}
function activate(t){const j=t?.closest(".jump");if(j)return go(people[+j.dataset.id]);const tg=t?.closest(".tog");if(tg)return flip(nodes[+tg.dataset.nid]);
  const c=t?.closest(".card");if(c)show(+c.dataset.id);else if(t?.closest("#svg"))closeSheet()}

vp.addEventListener("wheel",e=>{e.preventDefault();const r=vp.getBoundingClientRect();zoomAt(Math.exp(-e.deltaY*(e.ctrlKey?.01:.0015)),e.clientX-r.left,e.clientY-r.top)},{passive:false});
const ctr=()=>{const {w,h}=area();return[w/2,h/2]};

function applySel(){world.classList.toggle("focusing",!!sel);
  cL.querySelectorAll(".card").forEach(c=>{const p=people[+c.dataset.id];c.classList.toggle("sel",p===sel);c.classList.toggle("lin",!!lin&&lin.has(p))})}
const chip=q=>`<button data-go="${q.id}" class="f-${fam(q)}"><i></i>${esc(q.g==="—"?fullName(q):q.g.replace(/ \?$/,""))}</button>`;
const group=(t,list)=>list.length?`<h3>${t}</h3><div class="rel">${list.map(chip).join("")}</div>`:"";
function show(id){const p=people[id],had=!sheet.hidden;sel=p;lin=lineage(p);applySel();
  const tag=p.st==="rec"?'<span class="tg rec">Found in public records</span>':p.st==="unc"?'<span class="tg unc">Unclear or conflicting</span>':'<span class="tg">From family sources</span>';
  const sp=spouse(p);
  sin.innerHTML=`<div class="hd"><div class="big f-${fam(p)}">${esc(initials(p))}</div><div><h2>${esc(fullName(p))}</h2>${p.d?`<div class="d">${esc(p.d)}</div>`:""}</div></div>
   <div class="tags">${tag}${p.mpf?'<span class="tg mp">Mort pour la France</span>':""}</div>
   ${p.facts?`<ul>${p.facts.map(f=>`<li>${esc(f)}</li>`).join("")}</ul>`:""}
   ${group("Parents",parents(p))}${group("Spouse",sp?[sp]:[])}${group("Children",children(p))}
   <div class="src">Sources: ${(p.src||[]).map(srcHTML).join(" · ")}</div>`;
  sheet.hidden=false;sheet.scrollTop=0;
  // keep the person in view once the panel opens
  if(!had){const {w,h}=area(),sx=T.x+p.cx*T.k,sy=T.y+(p.cy+CH/2)*T.k;if(sx<60||sx>w-60||sy<40||sy>h-40)focus(p)}}
function closeSheet(){if(sheet.hidden&&!sel)return;sheet.hidden=true;sel=lin=null;applySel()}
sin.addEventListener("click",e=>{const b=e.target.closest("[data-go]");if(b)go(people[+b.dataset.go])});
document.getElementById("close").onclick=closeSheet;

/* ---------- search + branch chips ---------- */
function go(p){reveal(p);show(p.id);focus(p);const c=cL.querySelector(`[data-id="${p.id}"]`);c.classList.add("hl");setTimeout(()=>c.classList.remove("hl"),1600)}
const dl=document.getElementById("names"),byLabel={};
people.forEach(p=>{if(p.g==="—"||p.g==="?")return;let lab=fullName(p)+(p.d?` (${p.d})`:"");while(byLabel[lab])lab+=" ";byLabel[lab]=p;
  const o=document.createElement("option");o.value=lab;dl.appendChild(o)});
const q=document.getElementById("q");
q.addEventListener("change",()=>{const v=q.value.trim().toLowerCase();if(!v)return;const p=byLabel[q.value]||people.find(x=>fullName(x).toLowerCase().includes(v));if(p){go(p);q.value="";q.blur()}});
[["Ernest & Claire",ern],["Claude",ernestClaire.c[0].p],["Marc",ernestClaire.c[1].p],["Lise & Couzy",ernestClaire.c[3].p],["Ottenheimer",ottenheimer.p],["Clarens",wilhelm.p],["Jacques 1785",treeB.p],["Hoefnagel",th],["Pondrom USA",treeA.c[2].p]]
 .forEach(([t,p])=>{const b=document.createElement("button");b.className=`f-${fam(p)}`;b.style.setProperty("--c",`var(--${fam(p)})`);b.innerHTML=`<i></i>${esc(t)}`;b.onclick=()=>{if(p.node.c)p.node.open=true;go(p)};document.getElementById("chips").appendChild(b)});
document.getElementById("sub").textContent=`${people.filter(p=>p.g!=="—").length} people · tap a card for details, tap ± to fold a branch`;

/* ---------- theme ---------- */
const root=document.documentElement,mq=matchMedia("(prefers-color-scheme: dark)"),tb=document.getElementById("theme");
function setTheme(t){if(t)root.dataset.theme=t;const dark=t?t==="dark":mq.matches;root.classList.toggle("dark",dark);
  const l=`Switch to ${dark?"light":"dark"} mode`;tb.setAttribute("aria-label",l);tb.title=l}
try{setTheme(localStorage.getItem("theme"))}catch(e){setTheme(null)}
mq.addEventListener("change",()=>{if(!root.dataset.theme)setTheme(null)});
tb.onclick=()=>{const t=root.classList.contains("dark")?"light":"dark";setTheme(t);try{localStorage.setItem("theme",t)}catch(e){}};

render();
requestAnimationFrame(()=>focus(ern,.8,1));
</script>
</body>
